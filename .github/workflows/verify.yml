name: Verify games
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-games-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r platform/backend/requirements.txt
      - run: npm run check
      - run: npm test
      - run: python -m pytest platform/backend/tests -q
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check accessibility and reflow first
        run: npm run test:browser -- tests/browser/accessibility.spec.js
        env:
          ADIGUN_BROWSER_REPORT: test-results/accessibility-results.json
          ADIGUN_BROWSER_OUTPUT: test-results/accessibility
      - name: Verify gateway contract and unavailable-graphics controls
        run: node scripts/run-browser-gate.mjs contracts
        env:
          ADIGUN_BROWSER_REPORT: test-results/contract-results.json
          ADIGUN_BROWSER_OUTPUT: test-results/contracts
      - name: Verify actual rendering and playable game flows
        run: node scripts/run-browser-gate.mjs gameplay
      - name: Stage the verified repository root for Pages
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/pages"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/pages"
          test -f "$RUNNER_TEMP/pages/CNAME"
          test -f "$RUNNER_TEMP/pages/.nojekyll"
          test -f "$RUNNER_TEMP/pages/game9/index.html"
      - name: Package the verified Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages
          include-hidden-files: true
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-verification-${{ github.sha }}
          path: |
            test-results/
            dist/build-evidence.json
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified package
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
