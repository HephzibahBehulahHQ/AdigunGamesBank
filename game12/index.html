<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101e"><title>CORTEX PRIME | Game Bank</title><style>
:root{color-scheme:dark;--cyan:#5af3ef;--violet:#a78bfa;--gold:#ffd166;--bg:#060c18;--panel:#101c30;--muted:#a5b5cb}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#edf7ff;background:radial-gradient(circle at 50% 0,#26335f,var(--bg) 65%);font:16px/1.5 system-ui,sans-serif;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto;padding:8px;width:min(92%,500px);border:1px solid #5af3ef44;border-radius:12px;background:#081323;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.1em}.brand img{width:145px;max-height:42px;object-fit:contain}.brand small{display:block;color:var(--muted);font-size:9px}.wrap{width:min(900px,94%);margin:20px auto}.tag{color:var(--cyan);font:700 11px ui-monospace,monospace;letter-spacing:.2em}h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:8px}.lead{color:var(--muted)}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px}.pill{border:1px solid #5af3ef55;border-radius:99px;background:#071323;padding:8px 14px}.panel{max-width:680px;margin:18px auto;padding:24px;border:1px solid #a78bfa77;border-radius:20px;background:linear-gradient(145deg,#151e39,#0b1322);box-shadow:0 0 42px #9a7cff1f}.mode{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.mode button{border:1px solid #a78bfa88;background:#121b31;color:#eafaff;border-radius:9px;padding:9px 12px;cursor:pointer}.mode button[aria-pressed=true]{background:#a78bfa;color:#101020;font-weight:900}#puzzle{font:700 clamp(24px,5vw,42px) ui-monospace,monospace;letter-spacing:.05em;margin:28px auto;min-height:60px;color:var(--gold)}input{font:700 20px ui-monospace,monospace;max-width:230px;width:60%;padding:12px;border-radius:10px;border:1px solid #5af3ef88;background:#060c18;color:white;text-align:center}button.primary{display:block;margin:15px auto 0;padding:12px 25px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--cyan),#80ffb8);color:#07101e;font-weight:950;cursor:pointer}#msg{min-height:28px;color:var(--cyan);font-weight:750}.foot{font-size:12px;color:var(--muted)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="../shared/game-viewport.css">
<link rel="stylesheet" href="studio.css">
</head><body>
<a class="cortex-skip" href="#answer">Skip to answer</a>
<main id="studio" class="game-viewport">
  <h1 class="studio-sr">Cortex Prime</h1>
  <div class="cortex-readouts" aria-label="Puzzle progress">
    <span title="Level"><i aria-hidden="true">◇</i><span class="studio-sr">Level:</span> <b id="level">1</b></span>
    <span title="Solved"><i aria-hidden="true">✓</i><span class="studio-sr">Solved:</span> <b id="solved">0</b></span>
    <span title="Streak"><i aria-hidden="true">ϟ</i><span class="studio-sr">Streak:</span> <b id="streak">0</b></span>
  </div>
  <button id="help-open" class="cortex-help" type="button" aria-label="Help" aria-haspopup="dialog">?</button>
  <section class="cortex-playfield" aria-labelledby="modeTitle">
    <h2 id="modeTitle">Sequence Engine</h2>
    <div id="puzzle" aria-live="polite"></div>
  </section>
  <div class="cortex-actions">
    <p id="msg" class="studio-sr" role="status" aria-live="polite"></p>
    <div class="cortex-toolbar">
      <div class="mode" role="group" aria-label="Puzzle mode">
        <button type="button" data-mode="sequence" aria-pressed="true" aria-label="Sequence Engine" title="Sequence Engine">↦</button>
        <button type="button" data-mode="matrix" aria-pressed="false" aria-label="Matrix Vault" title="Matrix Vault">▦</button>
        <button type="button" data-mode="rule" aria-pressed="false" aria-label="Rule Decoder" title="Rule Decoder">ƒ</button>
      </div>
      <label for="answer" class="studio-sr">Your answer</label><input id="answer" inputmode="numeric" autocomplete="off" aria-describedby="instruction" placeholder="Answer">
      <button id="submit" type="button" class="primary">Lock answer</button>
    </div>
  </div>
  <dialog id="studio-help" aria-labelledby="help-title">
    <form method="dialog"><button class="cortex-close" aria-label="Close help" autofocus>×</button></form>
    <h2 id="help-title">Puzzle guide</h2>
    <p id="instruction">Find the next number in the progression.</p>
    <p>Switch between sequences, matrices and rule decoding using the three mode buttons. A correct answer advances the saved practice stage.</p>
    <a href="../">Game library</a>
  </dialog>
</main>
<script src="../assets/game-levels.js"></script><script src="../assets/game12.js"></script>
</body></html>
