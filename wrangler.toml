name = "adigungamesbank-account-preview"
main = "cloudflare/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = true
preview_urls = false

[vars]
PRODUCT_ACCOUNT_PREFIX = "adigungamesbank_preview"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/account", "/api/bot"]

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "1"
simple = { limit = 10, period = 60 }

[ai]
binding = "AI"

[[ratelimits]]
name = "BOT_LIMITER"
namespace_id = "3"
simple = { limit = 12, period = 60 }

[env.production]
name = "adigungamesbank-product"
workers_dev = false
preview_urls = false
routes = [{ pattern = "adigungamesbank.hephzibahbehulah.com/*", zone_name = "hephzibahbehulah.com" }]

[env.production.vars]
PRODUCT_ACCOUNT_PREFIX = "adigungamesbank"

[env.production.assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/account", "/api/bot"]

[[env.production.ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "2"
simple = { limit = 10, period = 60 }

[env.production.ai]
binding = "AI"

[[env.production.ratelimits]]
name = "BOT_LIMITER"
namespace_id = "4"
simple = { limit = 12, period = 60 }
